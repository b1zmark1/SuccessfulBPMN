services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ml_jobs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ml_jobs"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/ml_jobs
      REDIS_DSN: redis://redis:6379/0
      REDIS_STREAM_NAME: jobs:stream
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./workers
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/ml_jobs
      REDIS_DSN: redis://redis:6379/0
      REDIS_STREAM_NAME: jobs:stream
      WORKER_START_ID: 0-0
    command: ["python", "workers/job_worker.py", "--start-id", "0-0"]
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
